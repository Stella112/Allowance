[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Required for Coinbase tokenized stocks (B20 precompiles). Without it, forks run Beryl/Azul rules
# and calls to the stock tokens revert. Needs Foundry >= v1.8.4. Source: https://docs.base.org/sdks/base-anvil
hardfork = "base:Cobalt"
fs_permissions = [{ access = "write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Official public Base RPC (rate-limited). Tests pin a fork block so Foundry caches responses locally.
base = "https://mainnet.base.org"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
